# Multi Stage Build
name: Build & Push Docker Image
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Clonar repositorio
      
      - name: Construir imagen
        run: docker build -t mm54878/agua-fix-api:latest .

      - name: Retaggear imagen con commit
        run: docker tag mm54878/agua-fix-api:latest mm54878/agua-fix-api:${{ github.sha }}
# Secretos y variables !!!!!!! por ambiente
      - name: Docker login
        run: docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Push
        run: |
          docker push mm54878/agua-fix-api:latest
          docker push mm54878/agua-fix-api:${{ github.sha }}